# ============================================================
#  application.properties - the app's SETTINGS file
# ============================================================
#  Format:  key=value     (lines starting with # are comments)
#  Spring Boot reads this automatically at startup.
#  Change behaviour here WITHOUT changing Java code.
#  Full list of built-in keys: https://docs.spring.io/spring-boot/appendix/application-properties/

# Name of the application (shows in logs)
spring.application.name=springboot-basics

# Port the web server listens on (8080 is the default anyway)
server.port=8080

# ---------------- Database (H2 in-memory) ----------------
# "mem:studentdb" = database lives in RAM and is wiped when the app stops
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console  (use the JDBC URL above to log in)
spring.h2.console.enabled=true

# ---------------- JPA / Hibernate ----------------
# create-drop = build tables from your @Entity classes at startup, drop them at shutdown
spring.jpa.hibernate.ddl-auto=create-drop
# Print the SQL that Hibernate generates, so you can learn what it does behind the scenes
spring.jpa.show-sql=true

# ---------------- Our OWN custom settings (used in lesson04_config) ----------------
app.welcome-message=Welcome to Spring Boot basics!
app.owner=Sunny
app.max-notes=5
app.features.dark-mode=true
app.features.beta=false
